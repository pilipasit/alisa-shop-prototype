<!-- @dsCard group="Spacing" viewport="700x170" name="Corner Radius" subtitle="Soft rounded corners — xs through pill" -->
<!DOCTYPE html><html><head><meta charset="utf8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--white);padding:20px}
  .row{display:flex;gap:14px;align-items:center}
  .b{width:78px;height:78px;background:var(--pink-100);border:2px solid var(--pink-400);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;box-sizing:border-box}
  .b span{font-size:11px;font-weight:700;color:var(--pink-600)}
  .pill{width:120px;border-radius:var(--radius-pill)}
</style></head><body>
  <div class="row">
    <div class="b" style="border-radius:var(--radius-xs)"><span>xs · 6</span></div>
    <div class="b" style="border-radius:var(--radius-sm)"><span>sm · 10</span></div>
    <div class="b" style="border-radius:var(--radius-md)"><span>md · 16</span></div>
    <div class="b" style="border-radius:var(--radius-lg)"><span>lg · 24</span></div>
    <div class="b" style="border-radius:var(--radius-xl)"><span>xl · 32</span></div>
    <div class="b pill"><span>pill</span></div>
  </div>
</body></html>
