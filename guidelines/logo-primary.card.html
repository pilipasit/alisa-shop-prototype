<!DOCTYPE html><html><head><meta charset="utf8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--white);padding:20px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .cell{background:var(--cream);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--ring-soft);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
  .cell img{height:64px}
  .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-500)}
  .tag b{color:var(--pink-600)}
</style></head><body>
  <div class="grid">
    <div class="cell"><img src="../assets/logo-primary.svg" alt="alisa logo"><div class="tag"><b>Primary</b> · official — docs, signs, marketing</div></div>
    <div class="cell"><img src="../assets/logo-uniform.svg" alt="alisa logo uniform"><div class="tag"><b>Uniform</b> · staff wear, badges, prints</div></div>
  </div>
</body></html>
