<!-- @dsCard group="Colors" viewport="700x180" name="Neutrals" subtitle="Warm plum-tinted ink scale + cream page background" -->
<!DOCTYPE html><html><head><meta charset="utf8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--white);padding:18px}
  .row{display:flex;gap:8px}
  .sw{flex:1;border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--ring-soft)}
  .chip{height:58px}
  .meta{padding:6px 8px;font-size:11px}
  .meta b{display:block;font-weight:700;color:var(--ink-900)}
  .meta span{color:var(--ink-500);font-variant-numeric:tabular-nums}
</style></head><body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="meta"><b>ink 900</b><span>#2e1a26</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-700)"></div><div class="meta"><b>ink 700</b><span>#4a3340</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-500)"></div><div class="meta"><b>ink 500</b><span>#6f5563</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-300)"></div><div class="meta"><b>ink 300</b><span>#c2b3bc</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-200)"></div><div class="meta"><b>ink 200</b><span>#e4dbe0</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-100)"></div><div class="meta"><b>ink 100</b><span>#f1ebee</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--cream)"></div><div class="meta"><b>cream</b><span>#fffaf7</span></div></div>
  </div>
</body></html>
