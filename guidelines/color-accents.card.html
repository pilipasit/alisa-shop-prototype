<!-- @dsCard group="Colors" viewport="700x200" name="Category Accents" subtitle="Blue, green & yellow — playful set for signage, tags & categories" -->
<!DOCTYPE html><html><head><meta charset="utf8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--white);padding:18px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .col b{display:block;font-weight:700;color:var(--ink-900);font-size:13px;margin-bottom:6px}
  .ramp{display:flex;gap:6px}
  .sw{flex:1;border-radius:var(--radius-sm);box-shadow:var(--ring-soft);height:46px;display:flex;align-items:flex-end;padding:5px;box-sizing:border-box}
  .sw span{font-size:10px;font-weight:700;color:rgba(255,255,255,.92);font-variant-numeric:tabular-nums}
  .sw.lt span{color:rgba(46,26,38,.6)}
</style></head><body>
  <div class="grid">
    <div class="col"><b>Blue · sky</b><div class="ramp">
      <div class="sw" style="background:var(--blue-600)"><span>600</span></div>
      <div class="sw" style="background:var(--blue-500)"><span>500</span></div>
      <div class="sw lt" style="background:var(--blue-300)"><span>300</span></div>
      <div class="sw lt" style="background:var(--blue-100)"><span>100</span></div>
    </div></div>
    <div class="col"><b>Green · leaf</b><div class="ramp">
      <div class="sw" style="background:var(--green-600)"><span>600</span></div>
      <div class="sw" style="background:var(--green-500)"><span>500</span></div>
      <div class="sw lt" style="background:var(--green-300)"><span>300</span></div>
      <div class="sw lt" style="background:var(--green-100)"><span>100</span></div>
    </div></div>
    <div class="col"><b>Yellow · sunny</b><div class="ramp">
      <div class="sw lt" style="background:var(--yellow-600)"><span>600</span></div>
      <div class="sw lt" style="background:var(--yellow-500)"><span>500</span></div>
      <div class="sw lt" style="background:var(--yellow-400)"><span>400</span></div>
      <div class="sw lt" style="background:var(--yellow-100)"><span>100</span></div>
    </div></div>
  </div>
</body></html>
