<!-- @dsCard group="Type" viewport="700x300" name="Type Scale" subtitle="Display → caption ramp with tokens" -->
<!DOCTYPE html><html><head><meta charset="utf8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--white);padding:18px;color:var(--ink-900)}
  .r{display:flex;align-items:baseline;gap:14px;padding:5px 0;border-bottom:1px dashed var(--ink-100)}
  .r:last-child{border:0}
  .tok{font-family:var(--font-body);font-size:11px;color:var(--ink-400);width:110px;flex:none;font-variant-numeric:tabular-nums}
  .ex{font-family:var(--font-display);font-weight:600;line-height:1;color:var(--ink-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body>
  <div class="r"><span class="tok">display-xl · 64</span><span class="ex" style="font-size:40px">Аліса</span></div>
  <div class="r"><span class="tok">display · 48</span><span class="ex" style="font-size:34px">Розпродаж</span></div>
  <div class="r"><span class="tok">h1 · 40</span><span class="ex" style="font-size:30px">Новинки сезону</span></div>
  <div class="r"><span class="tok">h2 · 32</span><span class="ex" style="font-size:25px">Категорії товарів</span></div>
  <div class="r"><span class="tok">h3 · 24</span><span class="ex" style="font-size:21px">Одяг для малюків</span></div>
  <div class="r"><span class="tok">body · 16</span><span class="ex" style="font-size:16px;font-family:var(--font-body);font-weight:400">Зручна щоденна покупка для родини</span></div>
  <div class="r"><span class="tok">caption · 13</span><span class="ex" style="font-size:13px;font-family:var(--font-body);font-weight:400;color:var(--ink-500)">Ціни вказано в гривнях. Деталі — у магазині.</span></div>
</body></html>
