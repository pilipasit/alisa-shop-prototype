<!-- @dsCard group="Colors" viewport="700x170" name="Status & Sale" subtitle="Semantic colors — success, warning, danger, info, sale" -->
<!DOCTYPE html><html><head><meta charset="utf8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--white);padding:18px}
  .row{display:flex;gap:10px}
  .sw{flex:1;border-radius:var(--radius-md);padding:12px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;min-height:78px}
  .dot{width:26px;height:26px;border-radius:var(--radius-pill)}
  .lbl{font-weight:700;font-size:13px;color:var(--ink-900)}
  .hex{font-size:11px;color:var(--ink-500);font-variant-numeric:tabular-nums}
</style></head><body>
  <div class="row">
    <div class="sw" style="background:var(--success-soft)"><div class="dot" style="background:var(--success)"></div><div class="lbl">Success</div><div class="hex">#0a7a3b</div></div>
    <div class="sw" style="background:var(--warning-soft)"><div class="dot" style="background:var(--warning)"></div><div class="lbl">Warning</div><div class="hex">#c79400</div></div>
    <div class="sw" style="background:var(--danger-soft)"><div class="dot" style="background:var(--danger)"></div><div class="lbl">Danger</div><div class="hex">#e23636</div></div>
    <div class="sw" style="background:var(--info-soft)"><div class="dot" style="background:var(--info)"></div><div class="lbl">Info</div><div class="hex">#0b7fa6</div></div>
    <div class="sw" style="background:var(--sale-soft)"><div class="dot" style="background:var(--sale)"></div><div class="lbl">Sale</div><div class="hex">#b5026a</div></div>
  </div>
</body></html>
