<!DOCTYPE html><html><head><meta charset="utf8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--cream);padding:26px}
  .row{display:flex;gap:22px}
  .c{flex:1;height:84px;background:var(--white);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--ink-700)}
  .pink{background:var(--pink-500);color:#fff}
</style></head><body>
  <div class="row">
    <div class="c" style="box-shadow:var(--shadow-sm)">sm</div>
    <div class="c" style="box-shadow:var(--shadow-md)">md</div>
    <div class="c" style="box-shadow:var(--shadow-lg)">lg</div>
    <div class="c pink" style="box-shadow:var(--shadow-pink)">pink lift</div>
  </div>
</body></html>
