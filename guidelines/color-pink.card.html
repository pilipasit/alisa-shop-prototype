<!-- @dsCard group="Colors" viewport="700x180" name="Brand Pink" subtitle="Primary palette — the lead brand color from the logo" -->
<!DOCTYPE html><html><head><meta charset="utf8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--white);padding:18px}
  .row{display:flex;gap:10px}
  .sw{flex:1;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--ring-soft)}
  .chip{height:64px}
  .meta{padding:7px 10px;font-size:12px;line-height:1.35}
  .meta b{display:block;font-weight:700;color:var(--ink-900)}
  .meta span{color:var(--ink-500);font-variant-numeric:tabular-nums}
</style></head><body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--pink-600)"></div><div class="meta"><b>pink 600</b><span>#b5026a</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--pink-500)"></div><div class="meta"><b>pink 500 ★</b><span>#df0380</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--pink-400)"></div><div class="meta"><b>pink 400</b><span>#eb549c</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--pink-300)"></div><div class="meta"><b>pink 300</b><span>#f48cc0</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--pink-200)"></div><div class="meta"><b>pink 200</b><span>#f9c0dd</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--pink-100)"></div><div class="meta"><b>pink 100</b><span>#fdeef6</span></div></div>
  </div>
</body></html>
