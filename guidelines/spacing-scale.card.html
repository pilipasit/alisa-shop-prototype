<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing Scale" subtitle="4px base grid — space-1 through space-16" -->
<!DOCTYPE html><html><head><meta charset="utf8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--white);padding:20px}
  .row{display:flex;align-items:flex-end;gap:14px}
  .item{text-align:center}
  .bar{background:var(--pink-200);border-radius:var(--radius-xs);width:26px}
  .v{font-size:11px;color:var(--ink-900);font-weight:700;margin-top:6px}
  .t{font-size:10px;color:var(--ink-400)}
</style></head><body>
  <div class="row">
    <div class="item"><div class="bar" style="height:4px"></div><div class="v">4</div><div class="t">1</div></div>
    <div class="item"><div class="bar" style="height:8px"></div><div class="v">8</div><div class="t">2</div></div>
    <div class="item"><div class="bar" style="height:12px"></div><div class="v">12</div><div class="t">3</div></div>
    <div class="item"><div class="bar" style="height:16px"></div><div class="v">16</div><div class="t">4</div></div>
    <div class="item"><div class="bar" style="height:24px"></div><div class="v">24</div><div class="t">6</div></div>
    <div class="item"><div class="bar" style="height:32px"></div><div class="v">32</div><div class="t">8</div></div>
    <div class="item"><div class="bar" style="height:48px"></div><div class="v">48</div><div class="t">12</div></div>
    <div class="item"><div class="bar" style="height:64px"></div><div class="v">64</div><div class="t">16</div></div>
  </div>
</body></html>
