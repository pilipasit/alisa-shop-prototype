<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<!-- Supply-chain hardening. 'unsafe-eval' is required only because this prototype
     compiles JSX in the browser with Babel; the production build removes both
     'unsafe-eval' and the CDN entirely. Note: frame-ancestors and HSTS cannot be set
     via <meta> — they need real response headers (see SECURITY.md). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com 'unsafe-inline' 'unsafe-eval'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://*.workers.dev; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аліса — дитячий магазин (прототип)</title>
<meta name="description" content="Прототип інтернет-магазину дитячого одягу, взуття та іграшок «Аліса». Кам'янське · Дніпро.">
<meta name="theme-color" content="#df0380">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<!-- Link preview when this URL is shared in Instagram / Viber / Telegram.
     og:image MUST be an absolute URL or the image will not load. -->
<meta property="og:type" content="website">
<meta property="og:locale" content="uk_UA">
<meta property="og:title" content="Аліса — дитячий магазин">
<meta property="og:description" content="Одяг, взуття та іграшки для дітей. Кам'янське · Дніпро. Прототип для тестування.">
<meta property="og:image" content="https://pilipasit.github.io/alisa-shop-prototype/assets/logo-primary.svg">
<!-- PROTOTYPE ONLY: keeps draft legal text, demo reviews and placeholder
     addresses out of search. REMOVE this tag at launch. -->
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://pilipasit.github.io/alisa-shop-prototype/">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ClothingStore",
  "name": "Аліса — дитячий магазин",
  "alternateName": "Alisa Kids Store",
  "description": "Мережа дитячих магазинів: одяг, взуття, іграшки та сезонні товари для дітей від народження до 12 років. Кам'янське та Дніпро.",
  "image": "https://pilipasit.github.io/alisa-shop-prototype/assets/logo-primary.svg",
  "logo": "https://pilipasit.github.io/alisa-shop-prototype/assets/logo-primary.svg",
  "telephone": "+380988222964",
  "currenciesAccepted": "UAH",
  "paymentAccepted": "Готівка, Платіжна картка",
  "priceRange": "99–2499 ₴",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "бульвар Будівельників, 1-Б",
    "addressLocality": "Кам'янське",
    "addressRegion": "Дніпропетровська область",
    "addressCountry": "UA"
  },
  "openingHoursSpecification": [
    {
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": [
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday",
        "Sunday"
      ],
      "opens": "09:00",
      "closes": "20:00"
    }
  ],
  "sameAs": [
    "https://www.instagram.com/alisa.kids.shop/",
    "https://www.facebook.com/alisa.kids.ua/"
  ]
}
</script>
<link rel="stylesheet" href="styles.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-body);background:var(--cream);color:var(--ink-900);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 20px;text-align:center;
    background-image:radial-gradient(circle at 18% 18%, rgba(223,3,128,.06), transparent 42%),radial-gradient(circle at 82% 70%, rgba(12,176,227,.06), transparent 42%)}
  img.logo{height:64px;margin-bottom:6px}
  .sub{font-weight:700;color:var(--ink-500);font-size:15px;margin:0 0 4px}
  .meta{font-size:13px;color:var(--ink-400);font-weight:600;margin:0 0 28px}
  .cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;max-width:760px}
  a.card{text-decoration:none;background:#fff;border:1px solid var(--ink-100);border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm);padding:24px 22px;width:220px;display:flex;flex-direction:column;align-items:center;gap:10px;
    transition:transform .15s ease,box-shadow .15s ease}
  a.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
  .ic{width:56px;height:56px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:#fff}
  .t{font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--ink-900)}
  .d{font-size:13px;color:var(--ink-500);font-weight:600;line-height:1.4}
</style></head>
<body>
  <main>
  <img class="logo" src="assets/logo-primary.svg" alt="alisa">
  <h1 class="sub">Інтернет-магазин — прототип для тестування</h1>
  <p class="meta">Кам’янське · Дніпро · 3 магазини</p>
  <div class="cards">
    <a class="card" href="ui_kits/webshop/index.html">
      <span class="ic" style="background:var(--pink-500)"><i data-lucide="smartphone" style="width:28px;height:28px"></i></span>
      <span class="t">Мобільна версія</span>
      <span class="d">Повний прототип на телефоні — головна, каталог, товар, кошик, оформлення</span>
    </a>
    <a class="card" href="ui_kits/webshop/desktop.html">
      <span class="ic" style="background:var(--blue-500)"><i data-lucide="monitor" style="width:28px;height:28px"></i></span>
      <span class="t">Версія для ПК</span>
      <span class="d">Та сама вітрина на великому екрані — клікабельна</span>
    </a>
    <a class="card" href="ui_kits/webshop/blueprint.html">
      <span class="ic" style="background:var(--green-500)"><i data-lucide="map" style="width:28px;height:28px"></i></span>
      <span class="t">План (блупринт)</span>
      <span class="d">Структура сайту, екрани та план запуску</span>
    </a>
  </div>
  </main>
<script src="https://unpkg.com/lucide@0.456.0/dist/umd/lucide.min.js" integrity="sha384-xxUH8dZ+9qK6wOz3bNViyhHSIuVBQT5jsFlZAowZsRzRDsEqGjLGMJ/Wg10MPC3H" crossorigin="anonymous"></script>
<script>window.lucide&&lucide.createIcons();</script>
</body></html>
